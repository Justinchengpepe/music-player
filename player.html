<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vinyl Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a24;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;height:100vh}
#c{position:fixed;inset:0;z-index:1}
#c canvas{display:block}
</style>
</head>
<body>
<div id="c"></div>
<script type="importmap">{ "imports": { "three": "./js/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════
//  DATA
// ═══════════════════════════════════════════
const ALBUMS = [
  {t:'The College Dropout',y:2004,c:'#c49060',tracks:[{n:"We Don't Care",id:0},{n:'All Falls Down',id:5046362},{n:'Jesus Walks',id:5046865},{n:'Through the Wire',id:5046867},{n:'Slow Jamz',id:5046869},{n:'Family Business',id:0},{n:'Last Call',id:0}]},
  {t:'Late Registration',y:2005,c:'#d4a853',tracks:[{n:'Touch the Sky',id:5046871},{n:'Gold Digger',id:5046867},{n:'Drive Slow',id:0},{n:'Diamonds',id:5046875},{n:'Hey Mama',id:5046877},{n:'Roses',id:0},{n:'Gone',id:0}]},
  {t:'Graduation',y:2007,c:'#e74c8a',tracks:[{n:'Stronger',id:34160056},{n:'Good Life',id:5046881},{n:"Can't Tell Me Nothing",id:5046883},{n:'Flashing Lights',id:5046885},{n:'Homecoming',id:5046887},{n:'Everything I Am',id:0},{n:'Big Brother',id:0}]},
  {t:'808s & Heartbreak',y:2008,c:'#9b8ec4',tracks:[{n:'Heartless',id:1870033},{n:'Love Lockdown',id:1870035},{n:'Amazing',id:1870037},{n:'Paranoid',id:0},{n:'Coldest Winter',id:0},{n:'Welcome to Heartbreak',id:0},{n:'Say You Will',id:0}]},
  {t:'MBDTF',y:2010,c:'#c0392b',tracks:[{n:'Power',id:27969719},{n:'All of the Lights',id:27969830},{n:'Runaway',id:27969833},{n:'Monster',id:27969835},{n:'Dark Fantasy',id:27969838},{n:'Blame Game',id:0},{n:'Devil in a New Dress',id:0}]},
  {t:'Yeezus',y:2013,c:'#888',tracks:[{n:'Black Skinhead',id:26443399},{n:'Bound 2',id:26443404},{n:'New Slaves',id:0},{n:'Blood on the Leaves',id:0},{n:'Hold My Liquor',id:0},{n:'I Am a God',id:0},{n:'On Sight',id:0}]},
  {t:'The Life of Pablo',y:2016,c:'#e67e22',tracks:[{n:'Famous',id:41759670},{n:'Ultralight Beam',id:41759672},{n:'Father Stretch My Hands Pt.1',id:41759674},{n:'Waves',id:0},{n:'FML',id:0},{n:'Real Friends',id:0},{n:'No More Parties in LA',id:0}]},
  {t:'ye',y:2018,c:'#2ecc71',tracks:[{n:'Yikes',id:53834406},{n:'All Mine',id:0},{n:'Ghost Town',id:53834408},{n:'Violent Crimes',id:0},{n:'I Thought About Killing You',id:0},{n:'No Mistakes',id:0},{n:"Wouldn't Leave",id:0}]},
  {t:'Donda',y:2021,c:'#222',tracks:[{n:'Hurricane',id:1870054545},{n:'Jail',id:1870054547},{n:'Praise God',id:1870054549},{n:'Off the Grid',id:0},{n:'Moon',id:0},{n:'Believe What I Say',id:0},{n:'Come to Life',id:0}]}
];

// ═══════════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════════
const W = window.innerWidth, H = window.innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a24);
scene.fog = new THREE.Fog(0x1a1a24, 12, 30);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 50);
camera.position.set(0, 1.2, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('c').appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x445566, 1.2));
const mainLight = new THREE.DirectionalLight(0xfff0e0, 3.5);
mainLight.position.set(5, 6, 3);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(1024, 1024);
mainLight.shadow.camera.near = 0.5;
mainLight.shadow.camera.far = 35;
mainLight.shadow.camera.left = -15; mainLight.shadow.camera.right = 15;
mainLight.shadow.camera.top = 8; mainLight.shadow.camera.bottom = -8;
scene.add(mainLight);

// Floor
const floorGeom = new THREE.PlaneGeometry(40, 30);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1c1c26, roughness: 0.5, metalness: 0.2 });
const floor = new THREE.Mesh(floorGeom, floorMat);
floor.rotation.x = -Math.PI/2; floor.position.y = -4.6; floor.receiveShadow = true;
scene.add(floor);

// ═══════════════════════════════════════════
//  TURNTABLE (bottom-right)
// ═══════════════════════════════════════════
const TT_POS = { x: 4.8, y: -2.6, z: -3.8 };
const tt = new THREE.Group();
tt.position.set(TT_POS.x, TT_POS.y, TT_POS.z);
scene.add(tt);

// Base plinth
const plinthGeom = new THREE.CylinderGeometry(1.0, 1.05, 0.16, 48);
const plinthMat = new THREE.MeshStandardMaterial({ color: 0x2d2d35, roughness: 0.3, metalness: 0.25 });
tt.add(new THREE.Mesh(plinthGeom, plinthMat));

// Platter
const platterGeom = new THREE.CylinderGeometry(0.7, 0.7, 0.05, 64);
const platterMat = new THREE.MeshStandardMaterial({ color: 0x1e1e26, roughness: 0.25, metalness: 0.55 });
const platter = new THREE.Mesh(platterGeom, platterMat);
platter.position.y = 0.08; platter.receiveShadow = true;
tt.add(platter);

// Spindle
const spindleGeom = new THREE.CylinderGeometry(0.022, 0.022, 0.1, 12);
const spindleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.9 });
tt.add(new THREE.Mesh(spindleGeom, spindleMat)).position.y = 0.13;

// Tonearm assembly
const armBaseGeom = new THREE.CylinderGeometry(0.07, 0.08, 0.15, 16);
const armBase = new THREE.Mesh(armBaseGeom, new THREE.MeshStandardMaterial({ color: 0x3a3a40, roughness: 0.3, metalness: 0.6 }));
armBase.position.set(0.76, 0.07, 0.24);
tt.add(armBase);

const armTubeGeom = new THREE.CylinderGeometry(0.012, 0.014, 0.65, 8);
const armTube = new THREE.Mesh(armTubeGeom, new THREE.MeshStandardMaterial({ color: 0x4a4a50, roughness: 0.2, metalness: 0.7 }));
armTube.position.set(0.42, 0.16, 0.13);
armTube.rotation.z = 0.18; armTube.rotation.x = 0.3;
tt.add(armTube);

const headGeom = new THREE.BoxGeometry(0.035, 0.025, 0.055);
const head = new THREE.Mesh(headGeom, new THREE.MeshStandardMaterial({ color: 0x555, roughness: 0.3, metalness: 0.6 }));
head.position.set(0.16, 0.1, 0.05);
tt.add(head);

// Playing vinyl on turntable (hidden initially)
const playVinyl = new THREE.Group();
playVinyl.visible = false;
playVinyl.position.y = 0.11;
tt.add(playVinyl);

const pvDiscGeom = new THREE.CylinderGeometry(0.62, 0.62, 0.015, 56);
playVinyl.add(new THREE.Mesh(pvDiscGeom, new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.4, metalness: 0.1 })));

const pvLabelGeom = new THREE.CircleGeometry(0.13, 24);
const pvLabel = new THREE.Mesh(pvLabelGeom, new THREE.MeshStandardMaterial({ color: 0x444, roughness: 0.4, metalness: 0.15 }));
pvLabel.rotation.x = -Math.PI/2; pvLabel.position.y = 0.008;
playVinyl.add(pvLabel);

// ═══════════════════════════════════════════
//  VINYL GROOVE TEXTURE
// ═══════════════════════════════════════════
function createGrooveTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#080808'; ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 300; i++) {
    const r = 85 + i * 0.68;
    const alpha = 0.03 + Math.random() * 0.06;
    ctx.strokeStyle = `rgba(170,170,180,${alpha})`;
    ctx.lineWidth = 0.4 + Math.random() * 0.6;
    ctx.beginPath();
    ctx.arc(size/2, size/2, r, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2 + Math.PI * 1.6);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const grooveTex = createGrooveTexture();

// ═══════════════════════════════════════════
//  ALBUM CARDS
// ═══════════════════════════════════════════
const AW = 1.8;           // album width
const AH = 1.8;           // album height
const SPACING = 2.3;      // horizontal spacing
const VR = 0.6;           // vinyl radius

const cards = [];
let hoveredIdx = -1;
let selectedIdx = -1;
let scroll = 0;
let targetScroll = 0;

function createAlbumTexture(album) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, album.c);
  grad.addColorStop(1, '#12121a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Title
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 36px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(album.t, 256, 230);

  // Year
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '22px system-ui, -apple-system, sans-serif';
  ctx.fillText(album.y, 256, 280);

  // Bottom vinyl peek hint
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, size - 60, size, 60);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createVinyl(color) {
  const g = new THREE.Group();

  // Disc
  const discGeom = new THREE.CylinderGeometry(VR, VR, 0.014, 40);
  const discMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.1 });
  g.add(new THREE.Mesh(discGeom, discMat));

  // Grooves
  const grooveGeom = new THREE.CircleGeometry(VR, 40);
  const grooveMat = new THREE.MeshStandardMaterial({ map: grooveTex, roughness: 0.5, metalness: 0.08 });
  const gf = new THREE.Mesh(grooveGeom, grooveMat);
  gf.rotation.x = -Math.PI/2; gf.position.y = 0.008;
  g.add(gf);

  // Label
  const labelGeom = new THREE.CircleGeometry(0.11, 20);
  const labelMat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.12 });
  const lf = new THREE.Mesh(labelGeom, labelMat);
  lf.rotation.x = -Math.PI/2; lf.position.y = 0.009;
  g.add(lf);

  return g;
}

// ═══════════════════════════════════════════
//  BUILD
// ═══════════════════════════════════════════
function restX(i) { return (i - (ALBUMS.length-1)/2) * SPACING; }

ALBUMS.forEach((album, i) => {
  const card = new THREE.Group();

  // Cover
  const coverGeom = new THREE.PlaneGeometry(AW, AH);
  const coverMat = new THREE.MeshStandardMaterial({
    map: createAlbumTexture(album),
    roughness: 0.25,
    metalness: 0.02
  });
  const cover = new THREE.Mesh(coverGeom, coverMat);
  cover.castShadow = true;
  card.add(cover);

  // Vinyl (behind cover, peeking out top)
  const vinyl = createVinyl(album.c);
  vinyl.position.set(0, 0.5, -0.05);
  card.add(vinyl);

  // Position
  const x = restX(i);
  card.position.set(x, 0.05, -Math.abs(i - 4) * 0.15);
  scene.add(card);

  cards.push({
    group: card,
    coverMat,
    vinyl,
    album,
    targetX: x,
    vinylTargetY: 0.5,  // resting: peeking
    cardTargetY: 0.05
  });
});

// ═══════════════════════════════════════════
//  REAL COVERS
// ═══════════════════════════════════════════
function fetchCover(idx) {
  const album = ALBUMS[idx];
  const query = encodeURIComponent('Kanye West ' + album.t + ' album');
  fetch('https://itunes.apple.com/search?term=' + query + '&entity=album&limit=3')
    .then(r => r.json())
    .then(data => {
      if (data.results && data.results.length) {
        const url = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
        new THREE.TextureLoader().load(url, tex => {
          tex.colorSpace = THREE.SRGBColorSpace;
          cards[idx].coverMat.map = tex;
          cards[idx].coverMat.needsUpdate = true;
        });
      }
    })
    .catch(() => {});
}

ALBUMS.forEach((_, i) => fetchCover(i));

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-999, -999);

let pointerDown = false;
let pointerMoved = false;
const pointerStart = { x: 0, y: 0 };

const ctr = document.getElementById('c');

ctr.addEventListener('pointermove', e => {
  const r = ctr.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  if (pointerDown && (Math.abs(e.clientX - pointerStart.x) > 3 || Math.abs(e.clientY - pointerStart.y) > 3)) {
    pointerMoved = true;
  }
});

ctr.addEventListener('pointerdown', e => {
  pointerDown = true;
  pointerMoved = false;
  pointerStart.x = e.clientX;
  pointerStart.y = e.clientY;
});

ctr.addEventListener('pointerup', () => {
  if (pointerDown && !pointerMoved) {
    handleClick();
  }
  pointerDown = false;
});

ctr.addEventListener('pointerleave', () => {
  mouse.set(-999, -999);
  if (!selectedIdx) {
    hoveredIdx = -1;
    cards.forEach(c => { c.vinylTargetY = 0.5; c.cardTargetY = 0.05; });
  }
  pointerDown = false;
});

ctr.addEventListener('wheel', e => {
  e.preventDefault();
  targetScroll = Math.max(-6, Math.min(6, targetScroll - e.deltaY * 0.005));
}, { passive: false });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { deselect(); }
  if (e.key === 'ArrowRight') { targetScroll = Math.max(-6, targetScroll - 0.7); }
  if (e.key === 'ArrowLeft') { targetScroll = Math.min(6, targetScroll + 0.7); }
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
});

// ═══════════════════════════════════════════
//  HOVER
// ═══════════════════════════════════════════
function updateHover() {
  raycaster.setFromCamera(mouse, camera);
  const groups = cards.map(c => c.group);
  const hits = raycaster.intersectObjects(groups, true);

  let nh = -1;
  if (hits.length > 0) {
    let obj = hits[0].object;
    for (let i = 0; i < 12 && obj; i++) {
      const idx = cards.findIndex(c => c.group === obj);
      if (idx >= 0) { nh = idx; break; }
      obj = obj.parent;
    }
  }

  if (nh !== hoveredIdx) {
    hoveredIdx = nh;
    cards.forEach((c, i) => {
      if (i === nh) {
        c.vinylTargetY = 1.5;  // pull UP
        c.cardTargetY = 0.2;   // slight lift
      } else {
        c.vinylTargetY = 0.5;
        c.cardTargetY = 0.05;
      }
    });
  }
}

// ═══════════════════════════════════════════
//  SELECT / DESELECT
// ═══════════════════════════════════════════
let transition = null; // null | { phase: 'in'|'out', progress: 0 }

function select(idx) {
  if (transition) return;
  selectedIdx = idx;
  transition = { phase: 'in', progress: 0 };
}

function deselect() {
  if (transition) return;
  transition = { phase: 'out', progress: 0 };
}

function handleClick() {
  if (hoveredIdx < 0) return;
  if (selectedIdx === hoveredIdx) {
    // toggle pause — not supported by NetEase iframe, just deselect
    return;
  }
  select(hoveredIdx);
}

// ═══════════════════════════════════════════
//  LOOP
// ═══════════════════════════════════════════
const clock = new THREE.Clock();

function update() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (dt <= 0.001) { requestAnimationFrame(update); return; }

  // Smooth scroll
  scroll += (targetScroll - scroll) * Math.min(7 * dt, 1);

  updateHover();

  if (!transition) {
    // ── IDLE ──
    cards.forEach(c => {
      // Position X
      const rx = restX(cards.indexOf(c)) + scroll;
      c.targetX = rx;
      c.group.position.x += (c.targetX - c.group.position.x) * 8 * dt;
      c.group.position.z += (-Math.abs(cards.indexOf(c) - 4) * 0.15 - c.group.position.z) * 8 * dt;

      // Card Y
      c.group.position.y += (c.cardTargetY - c.group.position.y) * 8 * dt;

      // Vinyl Y (slide up)
      c.vinyl.position.y += (c.vinylTargetY - c.vinyl.position.y) * 10 * dt;
    });

    // Camera gentle follow
    const targetCamX = hoveredIdx >= 0 ? restX(hoveredIdx) * 0.1 + scroll * 0.1 : 0;
    camera.position.x += (targetCamX - camera.position.x) * 2.5 * dt;
    camera.lookAt(camera.position.x * 0.05, -0.1, 0);
  }

  // Spinning vinyl
  if (playVinyl.visible) {
    playVinyl.rotation.y += 2.2 * dt;
  }

  // ── Transition ──
  if (transition) {
    const sel = cards[selectedIdx];
    const spd = 3.2 * dt;
    transition.progress = Math.min(1, transition.progress + spd);
    const t = transition.progress;
    const ease = 1 - Math.pow(1 - t, 3);

    if (transition.phase === 'in') {
      sel.group.position.lerpVectors(
        new THREE.Vector3(restX(selectedIdx) + scroll, 0.05, sel.group.position.z),
        new THREE.Vector3(TT_POS.x, TT_POS.y, TT_POS.z - 0.2),
        ease
      );
      sel.group.scale.setScalar(1 - ease * 0.3);
      sel.coverMat.opacity = 1 - ease;

      // Fade others
      cards.forEach((c, i) => {
        if (i !== selectedIdx) c.coverMat.opacity = 1 - ease * 0.5;
      });

      if (t >= 1) {
        transition = null;
        playVinyl.visible = true;
        playVinyl.rotation.y = 0;
        pvLabel.material.color.set(ALBUMS[selectedIdx].c);
        sel.group.visible = false;
      }
    }

    if (transition.phase === 'out') {
      sel.group.visible = true;
      playVinyl.visible = false;
      selectedIdx = -1;

      sel.group.position.lerpVectors(
        new THREE.Vector3(TT_POS.x, TT_POS.y, TT_POS.z - 0.2),
        new THREE.Vector3(restX(cards.indexOf(sel)) + scroll, 0.05, -Math.abs(cards.indexOf(sel) - 4) * 0.15),
        ease
      );
      sel.group.scale.setScalar(0.7 + ease * 0.3);
      sel.coverMat.opacity = ease;

      cards.forEach((c, i) => {
        if (i !== cards.indexOf(sel)) c.coverMat.opacity = 0.5 + ease * 0.5;
      });

      if (t >= 1) {
        transition = null;
        cards.forEach(c => { c.coverMat.opacity = 1; c.group.scale.setScalar(1); });
      }
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
