<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body style="background:#f0f;margin:0;">
<h1 style="color:#fff;font-size:40px;text-align:center;margin-top:40vh;">TEST PAGE - DO YOU SEE THIS?</h1>
<script type="importmap">
{ "imports": { "three": "./js/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
document.body.innerHTML += '<h2 style="color:#0f0;text-align:center;">THREE LOADED: v' + THREE.REVISION + '</h2>';

// Create scene
var s = new THREE.Scene();
s.background = new THREE.Color(0x0066ff);
var c = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,50);
c.position.z = 6;
var r = new THREE.WebGLRenderer({antialias:true});
r.setSize(innerWidth,innerHeight);
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);

// Red cube
var g = new THREE.BoxGeometry(2,2,2);
var m = new THREE.MeshStandardMaterial({color:0xff0000});
var cube = new THREE.Mesh(g,m);
cube.position.y = -2;
s.add(cube);
s.add(new THREE.AmbientLight(0xffffff,1.5));

function loop(){ requestAnimationFrame(loop); cube.rotation.y+=0.01; r.render(s,c); }
loop();
</script>
</body>
</html>
